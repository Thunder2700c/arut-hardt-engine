name: Android ARM64 (explicit build only)
on:
  push:
    branches: [main, phase-4-character-animation]
    paths:
      - ".github/phase3-apk-test.trigger"
      - ".github/phase4-apk-test.trigger"
      - "scripts/fetch_default_character.sh"
      - "engine/rendering/src/android_renderer.cpp"
      - "engine/rendering/include/arut/rendering/**"
      - "engine/rendering/shaders/**"
  workflow_dispatch:
    inputs:
      build_apk:
        description: "Build the Android ARM64 APK with the bundled default humanoid"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  android-arm64:
    if: github.event_name == 'push' || inputs.build_apk == true
    name: Build native Android ARM64 APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare build diagnostics
        run: mkdir -p build-logs
      - name: Fetch and validate bundled CC0 default humanoid
        run: bash scripts/fetch_default_character.sh 2>&1 | tee build-logs/default-character.log
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: "12266719"
          packages: "platform-tools"
          accept-android-sdk-licenses: true
      - name: Install shader compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y glslang-tools
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > build-logs/sdk-licenses.log 2>&1
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1" > build-logs/sdk-install.log 2>&1
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Build Rust ARM64 static library
        env:
          CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER: aarch64-linux-android26-clang
        run: cargo build --workspace --locked --release --target aarch64-linux-android > build-logs/rust-build.log 2>&1
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Compile packaged Vulkan shaders
        run: |
          mkdir -p app/src/main/assets/shaders
          glslangValidator -V --target-env vulkan1.0 -o app/src/main/assets/shaders/first_triangle.vert.spv engine/rendering/shaders/first_triangle.vert
          glslangValidator -V --target-env vulkan1.0 -o app/src/main/assets/shaders/first_triangle.frag.spv engine/rendering/shaders/first_triangle.frag
          glslangValidator -V --target-env vulkan1.0 -o app/src/main/assets/shaders/mobile_pbr_forward.vert.spv engine/rendering/shaders/mobile_pbr_forward.vert
          glslangValidator -V --target-env vulkan1.0 -o app/src/main/assets/shaders/mobile_pbr_forward.frag.spv engine/rendering/shaders/mobile_pbr_forward.frag
          glslangValidator -V --target-env vulkan1.0 -o app/src/main/assets/shaders/mobile_shadow_depth.vert.spv engine/rendering/shaders/mobile_shadow_depth.vert
          glslangValidator -V --target-env vulkan1.0 -o app/src/main/assets/shaders/visibility_cull.comp.spv engine/rendering/shaders/visibility_cull.comp
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug > build-logs/android-build.log 2>&1
      - uses: actions/upload-artifact@v4
        with:
          name: arut-hardt-android-arm64-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arut-hardt-build-logs-${{ github.run_id }}
          path: build-logs/
          if-no-files-found: warn
          retention-days: 30
