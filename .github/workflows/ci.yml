name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpp:
    name: C++20 bootstrap
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build glslang-tools
      - name: Configure
        run: cmake --preset dev
      - name: Build
        run: cmake --build --preset dev --parallel 2
      - name: Test
        run: ctest --preset dev
      - name: Compile and validate Vulkan PBR shaders (no APK)
        run: |
          mkdir -p build/shaders
          glslangValidator -V --target-env vulkan1.0 -o build/shaders/mobile_pbr_forward.vert.spv engine/rendering/shaders/mobile_pbr_forward.vert
          glslangValidator -V --target-env vulkan1.0 -o build/shaders/mobile_pbr_forward.frag.spv engine/rendering/shaders/mobile_pbr_forward.frag
          glslangValidator -V --target-env vulkan1.0 -o build/shaders/first_triangle.vert.spv engine/rendering/shaders/first_triangle.vert
          glslangValidator -V --target-env vulkan1.0 -o build/shaders/first_triangle.frag.spv engine/rendering/shaders/first_triangle.frag

  rust:
    name: Rust workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Test
        run: cargo test --workspace --locked
