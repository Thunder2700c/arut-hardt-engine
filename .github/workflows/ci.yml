name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpp:
    name: C++20 bootstrap
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build glslang-tools libvulkan-dev mesa-vulkan-drivers
      - name: Configure
        run: cmake --preset dev
      - name: Build
        run: cmake --build --preset dev --parallel 2
      - name: Test
        run: set -o pipefail && ctest --preset dev --output-on-failure | tee build/dev/ctest.log
      - name: Upload Phase 3 ECS stress-test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arut-phase3-ecs-stress-test-logs
          path: |
            build/dev/phase3-ecs-5000-cubes.log
            build/dev/ctest.log
            build/dev/Testing/Temporary/LastTest.log
          if-no-files-found: warn
          retention-days: 30
      - name: Compile and validate Vulkan PBR shaders (no APK)
        run: |
          mkdir -p build/shaders
          glslangValidator -V --target-env vulkan1.0 -o build/shaders/mobile_pbr_forward.vert.spv engine/rendering/shaders/mobile_pbr_forward.vert
          glslangValidator -V --target-env vulkan1.0 -Iengine/rendering/shaders -o build/shaders/mobile_pbr_forward.frag.spv engine/rendering/shaders/mobile_pbr_forward.frag
          glslangValidator -V --target-env vulkan1.0 -Iengine/rendering/shaders -o build/shaders/pbr_brdf_reference.comp.spv engine/rendering/shaders/pbr_brdf_reference.comp
          c++ -std=c++20 -Wall -Wextra -Wpedantic -Iengine/rendering/include tests/vulkan_pbr_reference.cpp -lvulkan -o build/arut_vulkan_pbr_reference
          ICD_PATH="$(find /usr/share/vulkan/icd.d -maxdepth 1 -type f -iname '*lvp*.json' -print -quit)"
          if [ -z "$ICD_PATH" ]; then
            echo "Lavapipe ICD manifest not found. Installed manifests:"
            find /usr/share/vulkan/icd.d -maxdepth 1 -type f -print || true
            exit 1
          fi
          echo "Using Lavapipe ICD: $ICD_PATH"
          cat "$ICD_PATH"
          VK_DRIVER_FILES="$ICD_PATH" VK_ICD_FILENAMES="$ICD_PATH" build/arut_vulkan_pbr_reference build/shaders/pbr_brdf_reference.comp.spv
          glslangValidator -V --target-env vulkan1.0 -o build/shaders/mobile_shadow_depth.vert.spv engine/rendering/shaders/mobile_shadow_depth.vert
          glslangValidator -V --target-env vulkan1.0 -o build/shaders/visibility_cull.comp.spv engine/rendering/shaders/visibility_cull.comp
          glslangValidator -V --target-env vulkan1.0 -o build/shaders/first_triangle.vert.spv engine/rendering/shaders/first_triangle.vert
          glslangValidator -V --target-env vulkan1.0 -o build/shaders/first_triangle.frag.spv engine/rendering/shaders/first_triangle.frag

  rust:
    name: Rust workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Test
        run: cargo test --workspace --locked

  android-native-compile:
    name: Android ARM64 native library (no APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: "12266719"
          packages: "platform-tools"
          accept-android-sdk-licenses: true
      - name: Install Android NDK and CMake
        run: |
          yes | sdkmanager --licenses
          sdkmanager "ndk;27.2.12479018" "cmake;3.22.1" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Build Rust ARM64 static library
        env:
          CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER: aarch64-linux-android26-clang
        run: cargo build --workspace --locked --release --target aarch64-linux-android
      - name: Configure Android ARM64 native target
        run: cmake --preset android-arm64
      - name: Compile Android native library (no APK)
        run: cmake --build --preset android-arm64 --parallel 2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Compile Android Java activity (no APK)
        run: gradle --no-daemon :app:compileDebugJavaWithJavac
