name: Build ARUT Mobile (Android ARM64)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-editor:
    name: Godot-based Android ARM64 editor
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout engine configuration
        uses: actions/checkout@v6

      - name: Checkout matching Godot source
        uses: actions/checkout@v6
        with:
          repository: godotengine/godot
          ref: 4.7-stable
          path: godot
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install SCons
        run: python -m pip install scons==4.10.1

      - name: Restore SCons cache
        uses: actions/cache@v4
        with:
          path: godot/.scons_cache
          key: arut-mobile-godot-4.7-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            arut-mobile-godot-4.7-${{ runner.os }}-

      - name: Install Android Swappy dependency
        working-directory: godot
        run: python misc/scripts/install_swappy_android.py

      - name: Validate and apply ARUT-HARDT engine patches
        shell: bash
        run: |
          shopt -s nullglob
          patches=(engine/patches/*.patch)
          for patch in "${patches[@]}"; do
            echo "Validating ${patch}"
            git -C godot apply --check "$GITHUB_WORKSPACE/${patch}"
            git -C godot apply "$GITHUB_WORKSPACE/${patch}"
          done

      - name: Apply ARUT branding assets
        shell: bash
        run: |
          test -f engine/branding/arut_mark.svg
          cp engine/branding/arut_mark.svg godot/editor/icons/Godot.svg
          cp engine/branding/ArutLogo.svg godot/editor/icons/Logo.svg
          cp engine/branding/ArutTitleBarLogo.svg godot/editor/icons/TitleBarLogo.svg
          cp engine/branding/ArutCar3D.svg godot/editor/icons/ArutCar3D.svg
          cp engine/branding/ArutCharacter3D.svg godot/editor/icons/ArutCharacter3D.svg
          cp engine/branding/ArutRagdollDummy3D.svg godot/editor/icons/ArutRagdollDummy3D.svg
          cp engine/branding/ArutRenderProfile3D.svg godot/editor/icons/ArutRenderProfile3D.svg

      - name: Apply ARUT Mobile legacy and adaptive launcher icons
        shell: bash
        run: |
          set -euo pipefail
          icon="engine/branding/arut-mobile-icon.png"
          if [[ ! -f "$icon" ]]; then
            echo "::error title=Missing ARUT Mobile icon::Add a square PNG (at least 512x512) at engine/branding/arut-mobile-icon.png before running this workflow."
            exit 1
          fi
          python -m pip install Pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          icon_path = Path("engine/branding/arut-mobile-icon.png")
          with Image.open(icon_path) as source:
              if source.format != "PNG":
                  raise SystemExit("ARUT Mobile app icon must be a PNG file.")
              if source.width != source.height or source.width < 512:
                  raise SystemExit("ARUT Mobile app icon must be square and at least 512x512 pixels.")
              image = source.convert("RGBA")

          # The editor manifest resolves @mipmap/themed_icon from the shared Android
          # library resources. Keep density fallbacks there, and replace the API 26+
          # adaptive-icon XML too; otherwise Android may keep showing Godot's artwork.
          resource_root = Path("godot/platform/android/java/lib/src/main/res")
          density_sizes = {
              "mipmap-ldpi": 36,
              "mipmap-mdpi": 48,
              "mipmap-hdpi": 72,
              "mipmap-xhdpi": 96,
              "mipmap-xxhdpi": 144,
              "mipmap-xxxhdpi": 192,
          }
          adaptive_foreground_sizes = {
              "mipmap-ldpi": 81,
              "mipmap-mdpi": 108,
              "mipmap-hdpi": 162,
              "mipmap-xhdpi": 216,
              "mipmap-xxhdpi": 324,
              "mipmap-xxxhdpi": 432,
          }
          for directory, size in density_sizes.items():
              target_dir = resource_root / directory
              target_dir.mkdir(parents=True, exist_ok=True)
              resized = image.resize((size, size), Image.Resampling.LANCZOS)
              output = target_dir / "themed_icon.png"
              resized.save(output, format="PNG", optimize=True)
              print(f"Generated legacy launcher icon {output} ({size}x{size})")

          for directory, size in adaptive_foreground_sizes.items():
              target_dir = resource_root / directory
              target_dir.mkdir(parents=True, exist_ok=True)
              resized = image.resize((size, size), Image.Resampling.LANCZOS)
              output = target_dir / "arut_icon_foreground.png"
              resized.save(output, format="PNG", optimize=True)
              print(f"Generated adaptive launcher foreground {output} ({size}x{size})")

          adaptive_icon = resource_root / "mipmap-anydpi-v26" / "themed_icon.xml"
          adaptive_icon.parent.mkdir(parents=True, exist_ok=True)
          adaptive_icon.write_text(
              '<?xml version="1.0" encoding="utf-8"?>\\n'
              '<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">\\n'
              '    <background android:drawable="@android:color/black"/>\\n'
              '    <foreground android:drawable="@mipmap/arut_icon_foreground"/>\\n'
              '</adaptive-icon>\\n',
              encoding="utf-8",
          )
          print(f"Generated ARUT adaptive launcher icon {adaptive_icon}")
          PY

      - name: Add built-in ARUT C++ module
        shell: bash
        run: |
          test -f engine/modules/arut/config.py
          mkdir -p godot/modules/arut
          cp -a engine/modules/arut/. godot/modules/arut/

      - name: Preflight ARUT C++ headers and lifecycle callbacks
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import sys

          module = Path("engine/modules/arut")
          godot = Path("godot")
          sources = sorted(list(module.glob("*.h")) + list(module.glob("*.cpp")))
          errors = []

          invalid_override = re.compile(r"\bvoid\s+_(?:ready|process|physics_process)\s*\([^)]*\)\s*override\s*;")
          for source in sources:
              text = source.read_text(encoding="utf-8")
              if invalid_override.search(text):
                  errors.append(f"{source}: built-in Godot modules must not override _ready/_process/_physics_process directly; use _notification.")
              for include in re.findall(r'^\s*#include\s+"([^"]+)"', text, re.MULTILINE):
                  local_candidate = source.parent / include
                  godot_candidate = godot / include
                  if not local_candidate.is_file() and not godot_candidate.is_file():
                      errors.append(f"{source}: missing quoted include {include} (checked module folder and Godot 4.7 source).")

          for source_name in ("arut_character_3d.cpp", "arut_ragdoll_dummy_3d.cpp"):
              source = module / source_name
              if source.is_file():
                  text = source.read_text(encoding="utf-8")
                  if 'include "scene/resources/material.h"' not in text:
                      errors.append(f"{source}: expected StandardMaterial3D include from scene/resources/material.h.")

          if errors:
              print("\n".join(f"::error::{message}" for message in errors))
              sys.exit(1)

          print(f"Preflight passed: checked {len(sources)} ARUT C++ headers/sources and quoted include paths.")
          PY

      - name: Compile ARUT C++ objects before full editor build
        working-directory: godot
        run: |
          scons platform=android target=editor arch=arm64 production=yes dev_mode=yes module_text_server_fb_enabled=yes swappy=yes cache_path=.scons_cache/ redirect_build_objects=no modules/arut/arut_character_3d.android.editor.arm64.o modules/arut/arut_ragdoll_dummy_3d.android.editor.arm64.o modules/arut/arut_car_3d.android.editor.arm64.o modules/arut/arut_render_profile_3d.android.editor.arm64.o modules/arut/register_types.android.editor.arm64.o

      - name: Compile Android ARM64 editor
        working-directory: godot
        run: |
          scons platform=android target=editor arch=arm64 production=yes dev_mode=yes module_text_server_fb_enabled=yes swappy=yes cache_path=.scons_cache/ redirect_build_objects=no

      - name: Save partial SCons cache even after compile failure
        if: always()
        uses: actions/cache/save@v4
        with:
          path: godot/.scons_cache
          key: arut-mobile-godot-4.7-${{ runner.os }}-${{ github.sha }}

      - name: Package Android editor
        working-directory: godot/platform/android/java
        run: ./gradlew generateGodotEditor

      - name: Upload ARUT Mobile editor artifact
        uses: actions/upload-artifact@v6
        with:
          name: arut-mobile-editor-android-arm64
          path: godot/bin/android_editor_builds/
          if-no-files-found: error
          retention-days: 14

  native-extension:
    name: Native C++ extension and smoke-test project
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout engine project
        uses: actions/checkout@v6

      - name: Checkout godot-cpp
        uses: actions/checkout@v6
        with:
          repository: godotengine/godot-cpp
          ref: 2bb1acf6f8ae1ce96ac7b9ba3a10b499c59c49ec
          path: native/arut_native/godot-cpp
          submodules: recursive

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28b
          link-to-sdk: true

      - name: Set up Python and SCons
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install SCons
        run: python -m pip install scons==4.10.1

      - name: Build debug and release Android ARM64 libraries
        working-directory: native/arut_native
        run: |
          scons platform=android target=template_debug arch=arm64 precision=single api_version=4.7
          scons platform=android target=template_release arch=arm64 precision=single api_version=4.7

      - name: Assemble isolated smoke-test project
        shell: bash
        run: |
          mkdir -p tests/native_smoke/addons/arut_native/bin/android
          cp native/arut_native/arut_native.gdextension.in tests/native_smoke/addons/arut_native/arut_native.gdextension
          cp native/arut_native/package/addons/arut_native/bin/android/libarut_native.android.template_debug.arm64.so tests/native_smoke/addons/arut_native/bin/android/
          cp native/arut_native/package/addons/arut_native/bin/android/libarut_native.android.template_release.arm64.so tests/native_smoke/addons/arut_native/bin/android/
          cd tests/native_smoke
          zip -r "$GITHUB_WORKSPACE/arut-native-smoke-test-android-arm64.zip" .

      - name: Upload native smoke-test project
        uses: actions/upload-artifact@v6
        with:
          name: arut-native-smoke-test-android-arm64
          path: arut-native-smoke-test-android-arm64.zip
          if-no-files-found: error
          retention-days: 14

  renderer-demo:
    name: Package isolated anime-material demo
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout engine project
        uses: actions/checkout@v6
      - name: Package renderer demo
        run: |
          cd renderer/demo
          zip -r "$GITHUB_WORKSPACE/arut-anime-surface-demo.zip" .
      - name: Upload renderer demo project
        uses: actions/upload-artifact@v6
        with:
          name: arut-anime-surface-demo
          path: arut-anime-surface-demo.zip
          if-no-files-found: error
          retention-days: 14

  character-ragdoll-lab:
    name: Package native character and ragdoll test project
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout engine project
        uses: actions/checkout@v6
      - name: Package character lab
        run: |
          cd templates/arut_character_lab
          zip -r "$GITHUB_WORKSPACE/arut-character-ragdoll-lab.zip" .
      - name: Upload starter project
        uses: actions/upload-artifact@v6
        with:
          name: arut-character-ragdoll-lab
          path: arut-character-ragdoll-lab.zip
          if-no-files-found: error
          retention-days: 14
